      - {h: "Land prices", b: "Disagreements led one-third of approved plans to be rejected"}
      - {h: "Restrictions since 2016", b: "Land-use limits without completed acquisition prolonged waiting"}
      - {h: "Weak PMU capacity", b: "Poor coordination delayed compensation and contracts"}
    notes: ["3.3.4#6"]

  # ======================================================== 3.4 LESSONS
  - kind: cards
    section: lessons
    ref: "3.4.1"
    title: "Achievements"
    cols: 3
    cards:
      - {h: "Financial mobilization", b: "TEP USD 500 million, 26-year maturity, 10-year grace [21]; CCSEP 29 years [33]; lower costs [37]"}
      - {h: "Technical standards", b: "Smart grid in five 500-kV, ten 220-kV substations; 4,263 MW; O&M USD 0.87 → 0.67 [37]"}
      - {h: "Management standards", b: "Procurement and safeguard skills; NPT asset management system; CCSEP cost recovery 98% [43]"}
    notes: ["3.4.1"]
  - kind: cards
    section: lessons
    ref: "3.4.2"
    title: "Limitations"
    cols: 2
    cards:
      - {h: "Slow disbursement", b: "TEP 63.7% [41]; CCSEP nothing in 2017 and 2018, about 36% by late 2022 [43]"}
      - {h: "Procedural complexity", b: "TEP smart grid about four years [37]; CCSEP effective five and a half months late [33]"}
      - {h: "Counterpart funding", b: "CCSEP allocations from July 2019 [43]; TEP: USD 5.50 million of USD 5.74 million [41]; Binh Dinh [33]"}
      - {h: "Safeguard gaps", b: "Nha Trang 160 of 585 plans, complaint [43; 57]; TEP about 2,500 households [37]"}
    notes: ["3.4.2"]
  - kind: cards
    section: lessons
    ref: "3.4.3"
    title: "Recommendations (1/2)"
    lead: "As an upper-middle-income economy, future borrowing will rely on IBRD terms [4]."
    cols: 3
    cards:
      - {h: "1 · Prepare fully", b: "Settle technology, approvals, land before signing [37]; use a Project Preparation Advance"}
      - {h: "2 · Secure counterpart funds", b: "In the medium-term investment plan at approval; check provincial debt capacity"}
      - {h: "3 · Align compensation", b: "Meet ESS5 from preparation; independent valuation; early consultation"}
    notes: ["3.4.3#1-4"]
  - kind: cards
    section: lessons
    ref: "3.4.3"
    title: "Recommendations (2/2)"
    cols: 3
    cards:
      - {h: "4 · Stabilize PMUs", b: "Professional PMUs across projects; Open Learning Campus training"}
      - {h: "5 · Streamline procedures", b: "Decree No. 242/2025/ND-CP steps matched to the Bank cycle [53]"}
      - {h: "6 · Choose instruments", b: "PforR or DPF for measurable reforms; RAS for advice [36]"}
    notes: ["3.4.3#5-7"]

  # ======================================================== CONCLUSION
  - kind: divider
    section: concl
    title: "Conclusion"
    sub: "Findings, significance, limitations, further research"
    art: compass
    notes: ["concl", "concl-1"]
  - kind: cards
    section: concl
    ref: "Conclusion · 1.1"
    title: "Three pillars, one package"
    lead: "AAA-rated market funding lent on long maturities through IPF, DPF and PforR."
    cols: 3
    cards:
      - {h: "Finance", b: "Pays for investment through the project cycle and disbursement methods"}
      - {h: "Technical support", b: "Improves project design, policy and monitoring"}
      - {h: "Training", b: "Strengthens the people and institutions that carry out projects"}
    notes: ["concl-1.1"]
  - kind: cards
    section: concl
    ref: "Conclusion · 1.2"
    title: "What the two cases show"
    lead: "Binding constraints lay mainly on the domestic side, not in the availability of IBRD money."
    cols: 2
    cards:
      - {h: "TEP", b: "Outputs above targets, lower operating costs, highly satisfactory; but disbursed far less than committed"}
      - {h: "CCSEP", b: "Late counterpart funds, weak PMUs, resettlement disputes; cancelled funds, formal complaint"}
    notes: ["concl-1.2"]
  - kind: cards
    section: concl
    ref: "Conclusion · 2 · 3"
    title: "Significance and limitations"
    cols: 2
    cards:
      - {h: "Significance", b: "One framework applied to two projects; planned vs actual, IBRD vs IDA and counterpart funds"}
      - {h: "Limitations", b: "Secondary data; many sources prepared by the World Bank; no CCSEP completion report; two cases; system-wide indicators"}
    notes: ["concl-2", "concl-3"]
  - kind: cards
    section: concl
    ref: "Conclusion · 4"
    title: "Directions for further research"
    cols: 2
    cards:
      - {h: "Update CCSEP", b: "Once its completion report is published"}
      - {h: "Post-IDA projects", b: "Binh Duong water environment project and the southern waterway program"}
      - {h: "Other lenders", b: "Compare IBRD lending with the Asian Development Bank"}
      - {h: "Quantify delays", b: "Cost of counterpart and land delays in commitment fees and lost time"}
    notes: ["concl-4"]

  # ======================================================== BACK MATTER
