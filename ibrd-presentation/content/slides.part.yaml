  # ======================================================== INTRODUCTION
  - kind: divider
    section: intro
    title: "Introduction"
    sub: "Why the IBRD matters for Vietnam after IDA"
    art: globe
    notes: []
  - kind: bullets
    section: intro
    ref: "Introduction · 1.1"
    title: "The role of multilateral development finance"
    art: globe
    bullets:
      - "**Funding gap:** long-term investment needs far exceed domestic resources"
      - "**Costly markets:** international borrowing is costly, short-term or unavailable"
      - "**MDB advantage:** cheap funds passed on as longer maturities, lower rates"
      - "**Crisis role:** MDBs expanded lending in 2008 and COVID-19"
      - "**Beyond finance:** co-financing, guarantees, appraisal, technical assistance, standards"
    notes: ["intro-1.1"]
  - kind: timeline
    section: intro
    ref: "Introduction · 1.2"
    title: "Vietnam's shift from IDA to IBRD"
    items:
      - {d: "2007", t: "Bank declares Vietnam IBRD-eligible"}
      - {d: "December 2009", t: "First IBRD loan: US$500 million Public Investment Reform [1; 2]"}
      - {d: "July 2017", t: "Graduates from IDA; no more regular IDA credits"}
      - {d: "2018 →", t: "IBRD and non-concessional IDA only; IDA18 transitional support (FY18–20) [3]"}
      - {d: "July 2026", t: "Reclassified as an upper-middle-income economy [4]"}
    notes: ["intro-1.2#1"]
  - kind: bullets
    section: intro
    ref: "Introduction · 1.2"
    title: "Why the IBRD matters now"
    art: bank
    bullets:
      - "**Main source:** the IBRD is now Vietnam's main source of World Bank financing"
      - "**Middle path:** dearer than IDA credits, but cheaper and longer-term than most commercial loans"
      - "**Growing needs:** official financing alone will not be enough; capital markets at higher cost [3]"
      - "**Careful choices:** higher costs mean projects must be chosen and managed more carefully"
      - "**Beyond money:** appraisal, technical advice and international standards"
    notes: ["intro-1.2#2-4"]
  - kind: cards
    section: intro
    ref: "Introduction · 2"
    title: "Research problem and four questions"
    lead: "IBRD loans have different terms and procedures from the concessional credits Vietnam knew."
    cols: 2
    cards:
      - {h: "Q1", b: "What is the IBRD, and how was it formed and developed?"}
      - {h: "Q2", b: "How is the IBRD organized and funded, and on what terms does it lend?"}
      - {h: "Q3", b: "How does the IBRD support project financing through financial, technical and training assistance?"}
      - {h: "Q4", b: "What results and limitations have selected IBRD-supported projects in Vietnam shown, and what lessons follow?"}
    notes: ["intro-2"]
  - kind: cards
    section: intro
    ref: "Introduction · 3"
    title: "Research objectives"
    cols: 2
    cards:
      - {h: "3.1 Mechanisms", b: "How the IBRD raises funds (member capital, bonds), lends (IPF, DPF, PforR, guarantees) and runs the project cycle with borrowers and co-financiers"}
      - {h: "3.2 Practice in Vietnam", b: "Transmission Efficiency Project (2015-2021), fully IBRD-financed; judged on relevance, effectiveness, efficiency, sustainability"}
    notes: ["intro-3.1", "intro-3.2"]
  - kind: bullets
    section: intro
    ref: "Introduction · 4"
    title: "Research methodology"
    art: ledger
    bullets:
      - "**Qualitative approach:** literature review combined with case study analysis, mainly secondary data"
      - "**Sources:** World Bank reports and documents; Vietnamese government and ministry documents"
      - "**Case study:** TEP planned targets vs actual results, on the four criteria of Section 3.2"
      - "**Reducing bias:** World Bank data checked against IEG and Vietnamese government sources"
      - "**Limits:** no field surveys or interviews; some data from World Bank's own reports"
    notes: ["intro-4"]
  - kind: cards
    section: intro
    ref: "Introduction · 5"
    title: "Research scope"
    cols: 2
    cards:
      - {h: "Subject", b: "The IBRD and its project financing; IDA, IFC, MIGA only for comparison"}
      - {h: "Content", b: "Formation, funding, instruments, project cycle, financial, technical and training support"}
      - {h: "Space", b: "Vietnam; international examples only to explain how the IBRD works"}
      - {h: "Time", b: "2014 to the present, with special attention to the years after 2017"}
    notes: ["intro-5"]

  # ======================================================== CHAPTER 1
  - kind: divider
    section: ch1
    title: "Overview of the IBRD"
    sub: "Chapter 1"
    art: bank
    notes: ["ch1"]
  - kind: bullets
    section: ch1
    ref: "1.1.1"
    title: "Definition, mission and borrowers"
    art: bank
    bullets:
      - "**Cooperative:** a global development cooperative owned by 189 member countries [7]"
      - "**World Bank:** one of five World Bank Group institutions; with IDA forms the World Bank [7]"
      - "**Not profit-maximizing:** raises funds on capital markets and lends for development purposes"
      - "**Mission:** end extreme poverty and boost shared prosperity on a livable planet; jobs central"
      - "**Borrowers:** middle-income and creditworthy poorer countries, usually governments"
    notes: ["1.1.1"]
  - kind: table
    section: ch1
    ref: "1.1.2"
    title: "The five institutions (1/2)"
    table: T1
    cols: [0, 1, 2]
    notes: ["1.1.2#1", "T1"]
  - kind: table
    section: ch1
    ref: "1.1.2"
    title: "The five institutions (2/2)"
    table: T1
    cols: [0, 3, 4]
    notes: ["T1"]
  - kind: bullets
    section: ch1
    ref: "1.1.2"
    title: "How the IBRD differs"
    art: globe
    bullets:
      - "**Oldest and largest:** founded in 1944; the largest development bank in the world"
      - "**IBRD vs IDA:** market-based interest rates vs much cheaper, donor-funded terms"
      - "**IBRD vs IFC:** governments or guaranteed entities vs private companies without guarantee"
      - "**MIGA and ICSID:** no direct finance; reduce investor risk and settle disputes"
      - "**Main channel:** public financing to middle-income countries, hence its importance for Vietnam"
    notes: ["1.1.2#1-3"]
  - kind: cards
    section: ch1
    ref: "1.2"
    title: "History in four stages"
    cols: 2
    cards:
      - {h: "1944–1950s · Reconstruction", b: "Bretton Woods, July 1944; first loan US$250 million to France in 1947 [9]; Marshall Plan turns focus to developing countries [8]"}
      - {h: "1950s–1970s · Development", b: "Power, roads, railways, irrigation; IFC 1956, IDA 1960; McNamara era poverty focus [8]"}
      - {h: "1980s–1990s · Crisis and reform", b: "Structural adjustment lending after the debt crisis; then governance, anti-corruption, safeguards"}
      - {h: "2000–present · Global goals", b: "Counter-cyclical lending in 2008 and COVID-19; 2013 twin goals; livable planet, jobs [8]"}
    notes: ["1.2"]
  - kind: cards
    section: ch1
    ref: "1.3.1"
    title: "Governance: three levels"
    cols: 3
    cards:
      - {h: "Board of Governors", b: "Highest body; one Governor per member; meets once a year; admits members, changes capital"}
      - {h: "Board of Executive Directors", b: "President and 25 Executive Directors; meets several times a week; approves loans, budget"}
      - {h: "President", b: "Chairs the Board, leads the Group; five-year term; Ajay Banga since 2 June 2023 [10]"}
    notes: ["1.3.1"]
  - kind: bignums
    section: ch1
    ref: "1.3.2"
    title: "Voting power follows shares"
    nums:
      - {v: "15–16%", l: "United States share of votes"}
      - {v: "85%", l: "majority for amending the Articles"}
      - {v: "0.21%", l: "Vietnam's votes, April 2026 [11]"}
    bullets:
      - "**One share, one vote:** basic votes shared equally plus one vote per share held"
      - "**Effective veto:** the United States can block decisions needing an 85 percent majority"
      - "**Reforms:** 2008–2010 reforms raised basic votes, shifting power to developing and transition countries"
      - "**Vietnam:** votes through a constituency sharing one Executive Director"
    notes: ["1.3.2"]
  - kind: flow
    section: ch1
    ref: "1.3.3"
    title: "Source of funds"
    steps:
      - {h: "Member capital", b: "Small paid-in share; callable capital never called; 2018 capital increase [12]"}
      - {h: "Bond issuance", b: "Largest source; AAA rating for decades; sustainable and green bonds [13]"}
      - {h: "IBRD", b: "Financial intermediary between global markets and member countries"}
      - {h: "Loans", b: "Long maturities, reasonable costs; repayments recycled into new loans"}
    bullets:
      - "**Versus IDA:** IDA depends on donations; the IBRD funds itself through the market"
      - "**New tools:** hybrid capital and shareholder guarantees"
    notes: ["1.3.3"]
  - kind: cards
    section: ch1
    ref: "1.4.1"
    title: "Three lending instruments"
    lead: "Under IPF the IBRD pays for inputs; under DPF, for reforms; under PforR, for results."
    cols: 3
    cards:
      - {h: "IPF", b: "Ring-fenced activities; disbursed as eligible expenditures are incurred [14]; TEP and CCSEP"}
      - {h: "DPF", b: "Reforms; prior actions before approval; funds to the budget [14]; Vietnam's first IBRD loan [2]"}
      - {h: "PforR", b: "Since 2012, third instrument since 1944 [15]; disbursed on verified DLIs [14]"}
    notes: ["1.4#1", "1.4.1#1-3"]
  - kind: table
    section: ch1
    ref: "1.4.1"
    title: "Instruments compared"
    table: T2
    notes: ["1.4.1#4", "T2"]
  - kind: bullets
    section: ch1
    ref: "1.4.2"
    title: "Loan terms: price (1/2)"
    art: ledger
    bullets:
      - "**IBRD Flexible Loan:** leading product for public borrowers in middle-income countries [16]"
      - "**Three cost parts:** interest rate, front-end fee and commitment fee [16]"
      - "**Interest:** reference rate plus spread; SOFR replaced LIBOR for US dollar loans [17]"
      - "**Spread:** contractual spread plus maturity premium; fixed-spread option suspended in 2021 [17]"
      - "**Commitment fee:** slow disbursement raises the effective cost of the loan"
    notes: ["1.4.2#1-2", "1.4.2#5"]
  - kind: bullets
    section: ch1
    ref: "1.4.2"
    title: "Loan terms: maturity (2/2)"
    art: ledger
    bullets:
      - "**2014 extension:** maximum final maturity 30 → 35 years; average maturity 18 → 20 years [18]"
      - "**Up to 50 years:** final maturity for some projects [19]"
      - "**Short Maturity Loan:** October 2024; 7-year final maturity, 20-basis-point spread discount [20]"
      - "**TEP:** 26-year maturity with a 10-year grace period [21]"
      - "**CCSEP:** IBRD 29 years, 10-year grace; IDA credit 25 years, 5-year grace"
    notes: ["1.4.2#3-4"]
  - kind: table
    section: ch1
    ref: "1.4.2"
    title: "Main terms of the IBRD Flexible Loan"
    table: T3
    notes: ["T3"]
  - kind: bullets
    section: ch1
    ref: "1.4.3"
    title: "Safeguards and procurement"
    art: scroll
    bullets:
      - "**ESF:** approved 4 August 2016; applies to IPF initiated on or after 1 October 2018 [22]"
      - "**Older policies:** earlier projects keep Safeguard Policies (OP 4.12); parallel about seven years [23]"
      - "**TEP and CCSEP:** prepared before 2018, so followed the Safeguard Policies"
      - "**Procurement Framework:** concept note on or after 1 July 2016 [24]; PPSD for CCSEP"
      - "**Stricter rules:** gaps with domestic land rules cause delays or, in Nha Trang, lost financing"
    notes: ["1.4.3#1-2", "1.4.3#14-15"]
  - kind: grid
    section: ch1
    ref: "1.4.3"
    title: "Ten Environmental and Social Standards"
    lead: "The ESF shifts more responsibility to the borrower [22]."
    items:
      - "ESS1: Assessment and Management of Environmental and Social Risks and Impacts"
      - "ESS2: Labor and Working Conditions"
      - "ESS3: Resource Efficiency and Pollution Prevention and Management"
      - "ESS4: Community Health and Safety"
      - "ESS5: Land Acquisition, Restrictions on Land Use and Involuntary Resettlement"
      - "ESS6: Biodiversity Conservation and Sustainable Management of Living Natural Resources"
      - "ESS7: Indigenous Peoples"
      - "ESS8: Cultural Heritage"
      - "ESS9: Financial Intermediaries"
      - "ESS10: Stakeholder Engagement and Information Disclosure"
    notes: ["1.4.3#3-13"]

  # ======================================================== CHAPTER 2
  - kind: divider
    section: ch2
    title: "How the IBRD supports project financing"
    sub: "Chapter 2"
    art: ledger
    notes: ["ch2", "2.1#1"]
  - kind: cycle
    section: ch2
    ref: "2.1.1"
    title: "The six-stage project cycle"
    lead: "The borrower owns and implements; the Bank advises, appraises, finances and supervises [25]."
    steps: ["Identification", "Preparation", "Appraisal", "Negotiation and Board approval", "Implementation and supervision", "Completion and evaluation"]
    notes: ["2.1.1#1"]
  - kind: table
    section: ch2
    ref: "2.1.1"
    title: "Stages of the project cycle (1/2)"
    table: T4
    rows: [0, 3]
    notes: ["T4"]
  - kind: table
    section: ch2
    ref: "2.1.1"
    title: "Stages of the project cycle (2/2)"
    table: T4
    rows: [3, 6]
    notes: ["T4"]
  - kind: bullets
    section: ch2
    ref: "2.1.1"
    title: "The cycle does not end at approval"
    art: compass
    bullets:
      - "**Restructuring:** TEP restructured in 2019 and extended by two years"
      - "**Cancellation:** CCSEP restructured in 2022; about US$45.6 million of loan funds cancelled"
      - "**Two systems:** domestic approvals, counterpart funds and on-lending run alongside each stage"
      - "**Joint delays:** CCSEP became effective about five and a half months later than planned"
    notes: ["2.1.1#2-3"]
  - kind: table
    section: ch2
    ref: "2.1.2"
    title: "Four disbursement methods"
    table: T5
    notes: ["2.1.2#1", "T5"]
  - kind: bullets
    section: ch2
    ref: "2.1.2"
    title: "Counterpart funding as the constraint"
    art: ledger
    bullets:
      - "**Documentation:** each withdrawal documented; deadline usually four months after closing [26]"
      - "**Counterpart share:** CCSEP funds covered land, resettlement, staff, operating costs, training"
      - "**TEP:** NPT provided US$231.25 million of the planned US$731.25 million [21]"
      - "**Binding constraint:** CCSEP allocations began July 2019; no disbursement in 2017 and 2018"
      - "**Real debt:** where loans are on-lent, provinces take on real debt obligations"
    notes: ["2.1.2#2-4"]
  - kind: bullets
    section: ch2
    ref: "2.1.3"
    title: "Instruments in practice: IPF and PforR"
    art: pylon
    bullets:
      - "**IPF:** components, results framework, implementing agency; funds follow contract progress"
      - "**TEP model:** three components via NPT boards; land or bidding delays slow funds"
      - "**PforR:** funds released only after verified Disbursement-Linked Indicators"
      - "**IEG on DLIs:** choice is critical; monitoring should not focus on DLIs alone [32]"
      - "**For Vietnam:** results-based design shifts responsibility, and risk, to domestic agencies"
    notes: ["2.1.3#1", "2.1.3#3-4"]
  - kind: chart
    section: ch2
    ref: "2.1.3"
    title: "DPF in Vietnam: policy matrix to budget"
    chart: DPF
    bullets:
      - "**PIR 1:** US$500 million IBRD, December 2009 [2]"
      - "**PIR 2:** May 2011; IBRD US$87.3 million, IDA US$262.7 million [28]"
      - "**Aims:** investment cycle; legal basis for public-private partnerships [29; 30]"
      - "**Power sector:** 2010; IBRD US$200 million, IDA US$111.8 million [31]"
    notes: ["2.1.3#2", "DPF"]
  - kind: bullets
    section: ch2
    ref: "2.2.1"
    title: "Technical support: preparation"
    art: compass
    bullets:
      - "**Task team:** technical, financial, procurement and safeguard specialists advise the borrower"
      - "**Viability check:** TEP appraisal estimated an EIRR of 31.4%"
      - "**E&S instruments:** CCSEP: an ESIA per city, one resettlement framework [33]"
      - "**Preparation Advance:** finances preparation; refinanced from the loan [27]"
      - "**Quality matters:** better TEP smart-grid preparation would have avoided the extension"
    notes: ["2.2#1", "2.2.1"]
  - kind: chart
    section: ch2
    ref: "2.2.2"
    title: "Advisory Services and Analytics"
    chart: ASA
    bullets:
      - "**ASA:** reports, policy notes, advice, workshops [34]"
      - "**2023:** US$991 million disbursed [35]"
      - "**RAS:** client-paid [34]; mainly middle- and high-income countries [36]"
      - "**Vietnam:** PIR dialogue [2]; PPIAF US$350,000 and GIZ for CCSEP"
    notes: ["2.2.2"]
  - kind: cards
    section: ch2
    ref: "2.2.3"
    title: "Monitoring and evaluation: three levels"
    lead: "CCSEP results framework: about 290,000 beneficiaries, 256,000 sewer connections, 100% cost recovery."
    cols: 3
    cards:
      - {h: "Supervision", b: "Regular ISRs rate progress to the PDO and implementation ({{ay:World Bank, n.d.-c|25|inferred}})"}
      - {h: "Completion", b: "ICR at closing compares results with targets"}
      - {h: "Independent evaluation", b: "IEG validates the ICR; PPAR for selected projects"}
    notes: ["2.2.3#1-5"]
  - kind: bullets
    section: ch2
    ref: "2.2.3"
    title: "What M&E shows and its limits"
    art: compass
    bullets:
      - "**TEP PPAR:** outcome highly satisfactory, Bank performance satisfactory, M&E quality substantial [37]"
      - "**Early warning:** in 2022, CCSEP's likelihood of achieving its PDO was downgraded to moderately unsatisfactory"
      - "**Attribution:** system-wide indicators such as transmission losses are not the project alone"
      - "**No ICR:** for CCSEP, the assessment must rely on interim reports"
    notes: ["2.2.3#6-7"]
  - kind: bullets
    section: ch2
    ref: "2.3.1"
    title: "Training project management units"
    art: ledger
    bullets:
      - "**PMUs:** TEP used NPT's northern, central and southern boards; CCSEP one PMU per province"
      - "**Training:** project and financial management, procurement and safeguards"
      - "**Open Learning Campus:** orientation courses from Bank expectations to M&E [38]"
      - "**Staff continuity:** the new PMU in Phan Rang drew 10 of its 12 staff from other ODA units"
      - "**Still weak:** PMU capacity remained a main cause of CCSEP delay"
    notes: ["2.3#1", "2.3.1"]
  - kind: bullets
    section: ch2
    ref: "2.3.2"
    title: "Knowledge transfer by doing"
    art: scroll
    bullets:
      - "**Learning by doing:** staff apply Bank rules on real contracts; Bank specialists review key steps"
      - "**MOOC:** 2014 public procurement course, more than 540 certified learners [39]"
      - "**E-procurement:** certification after an examination [40]"
      - "**TEP:** NPT boards built procurement, financial and safeguard capabilities [37]"
      - "**Harder to transfer:** in Nha Trang, local compensation rules clashed with Bank standards"
    notes: ["2.3.2"]
  - kind: table
    section: ch2
    ref: "2.3.3"
    title: "Institutional reform in the two cases"
    table: T6
    notes: ["2.3.3#1", "T6"]
  - kind: bignums
    section: ch2
    ref: "2.3.3"
    title: "Reform depends on the borrower"
    nums:
      - {v: "5.50", l: "US$ million from NPT"}
      - {v: "5.74", l: "US$ million, TEP capacity-building cost"}
      - {v: "0.24", l: "US$ million from the IBRD"}
    bullets:
      - "**National level:** the PIR series strengthened selection and implementation of public investment [2]"
      - "**CCSEP:** all of Component 4 financed by counterpart funds; many reforms stopped at setup"
      - "**Lesson:** the IBRD can design and advise; the borrower must fund and sustain reform"
    notes: ["2.3.3#2-3"]
  - kind: table
    section: ch2
    ref: "2.4"
    title: "Three forms of support across the cycle"
    table: T7
    notes: ["2.4#1", "T7"]
  - kind: cards
    section: ch2
    ref: "2.4"
    title: "One package, one dependency"
    lead: "The package works only when domestic systems are ready to absorb it."
    cols: 3
    cards:
      - {h: "Money gives weight to advice", b: "Standards are adopted when they are loan conditions"}
      - {h: "Advice protects the money", b: "Appraisal and supervision reduce the risk of wasted funds"}
      - {h: "Training protects results", b: "Assets work only if local institutions run them"}
    notes: ["2.4#2-3"]

  # ======================================================== CHAPTER 3
  - kind: divider
    section: ch3
    title: "The IBRD and selected projects in Vietnam"
    sub: "Chapter 3"
    art: coast
    notes: ["ch3"]
  - kind: timeline
    section: ch3
    ref: "3.1 · 3.1.1"
    title: "Vietnam and the World Bank since 1993"
    items:
      - {d: "October 1993", t: "Lending resumes; IDA credits: approximately USD 70 million primary education, USD 158.5 million highways [45; 46]"}
      - {d: "1994", t: "Resident office opens in Hanoi, alongside Đổi Mới reforms [45; 46]"}
      - {d: "7 August 2014", t: "TEP IBRD loan approved, almost three years before graduation [44; 41]"}
      - {d: "1 July 2017", t: "IDA graduation; IDA18 transitional SDR 1.593 billion [3]"}
      - {d: "July 2026", t: "Upper-middle-income reclassification, distinct from graduation [4]"}
    notes: ["3.1", "3.1.1#1", "3.1.2#1-3"]
  - kind: bullets
    section: ch3
    ref: "3.1.1 · 3.1.2"
    title: "A shift in lending mix"
    art: globe
    bullets:
      - "**Planned vs actual:** appraisal figures are plans; closing amounts are reported spending [44; 41; 37]"
      - "**Umbrella term:** \"World Bank financing\" may be IDA or IBRD; check legal documents"
      - "**Market pricing:** debt capacity, selection, returns and fiscal risk matter more"
      - "**Coexistence:** IBRD-financed TEP ran alongside IDA before 2017 [44; 41]"
      - "**Not substitution:** graduation shifted lending mix and conditions"
    notes: ["3.1", "3.1.1#2", "3.1.2#2-3"]
  - kind: bullets
    section: ch3
    ref: "3.1.3"
    title: "A late IDA project: SAHEP (2017)"
    art: scroll
    bullets:
