    title: "What the two cases show"
    art: compass
    left:
      h: "TEP"
      items:
        - "**Results:** outputs above targets, operating costs fell, IEG rated it highly satisfactory"
        - "**But:** a successful project may still disburse far less than its commitment"
    right:
      h: "CCSEP"
      items:
        - "**Constraints:** late counterpart funding, weak PMU capacity, resettlement disputes"
        - "**Consequences:** results below targets, cancelled funds and a formal complaint"
