    part: concl
    ground: paper
    ref: "Conclusion · 1.2"
    art: compass
    quote: "Across both cases, the binding constraints lay mainly on the domestic side rather than in the availability of IBRD money."
    by: "Conclusion of the paper"
    notes: ["concl-1.2"]
