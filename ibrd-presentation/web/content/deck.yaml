  - tpl: cards
    part: ch2
    ground: wash
    ref: "2.4"
    title: "How the three forms reinforce one another"
    cols: 3
    art: gears
    cards:
      - {h: "Money gives weight to advice", b: "Standards are adopted when they are conditions of a loan"}
      - {h: "Advice protects the money", b: "Appraisal and supervision reduce the risk of wasted funds"}
      - {h: "Training protects the results", b: "Assets keep working only if local institutions run them"}
    foot: "Binding constraints usually lie on the domestic side: counterpart funding, land acquisition and PMU capacity."
