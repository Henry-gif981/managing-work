  # ================================================================= 3.4 · LESSONS
  - tpl: chapter
    part: lessons
    ground: night
    obj: center
    title: "Achievements, limitations, recommendations"
    sub: "Sections 3.4.1 – 3.4.3"
    notes: []
  - tpl: cards
    part: lessons
    ground: paper
    ref: "3.4.1"
    title: "Achievements"
    cols: 3
    art: compass
    cards:
      - {h: "Financial mobilization", b: "TEP USD 500 million, 26-year maturity, 10-year grace [21]; CCSEP 29 years [33]; lower capital costs [37]"}
      - {h: "Technical standards", b: "Smart grid in five 500-kV and ten 220-kV substations; 4,263 MW; O&M USD 0.87 → 0.67 per MWh [37]"}
      - {h: "Management standards", b: "Procurement, finance and safeguard skills; NPT's asset management system; cost recovery 98% [43]"}
    foot: "These changes in institutions are likely to last longer than any single project."
    notes: ["3.4.1"]
  - tpl: cards
    part: lessons
    ground: wash
    ref: "3.4.2"
    title: "Limitations"
    cols: 2
    art: scales
    cards:
      - {h: "Slow disbursement", b: "TEP 63.7% of its commitment [41]; CCSEP nothing in 2017 and 2018, about 36% by late 2022 [43]"}
      - {h: "Procedural complexity", b: "TEP smart-grid choice about four years [37]; CCSEP effective five and a half months late [33]"}
      - {h: "Counterpart funding", b: "CCSEP allocations only from July 2019 [43]; TEP USD 5.50 of 5.74 million [41]; Binh Dinh debt ceiling [33]"}
      - {h: "Safeguards vs domestic rules", b: "Nha Trang 160 of 585 plans, a complaint [43; 57]; TEP about 2,500 households [37]"}
    notes: ["3.4.2"]
  - tpl: gallery
    part: lessons
    ground: night
    obj: left
    ref: "3.4.3"
    title: "Recommendations (1/2)"
    lead: "As an upper-middle-income economy since 2026, future World Bank borrowing will rely on IBRD terms [4]."
    bullets:
      - "**1 · Prepare projects fully:** settle technology, approvals, land before signing [37]; use a Project Preparation Advance"
      - "**2 · Secure counterpart funding:** in the medium-term investment plan at approval; check provincial debt capacity"
      - "**3 · Align compensation early:** meet ESS5 from preparation; independent valuation, early consultation"
    notes: ["3.4.3#1-4"]
  - tpl: gallery
    part: lessons
    ground: night
    obj: left
    ref: "3.4.3"
    title: "Recommendations (2/2)"
    bullets:
      - "**4 · Stabilize PMUs:** professional units managing several projects; Open Learning Campus training"
      - "**5 · Streamline procedures:** Decree No. 242/2025/ND-CP steps scheduled to match the Bank cycle [53]"
      - "**6 · Choose instruments strategically:** PforR or DPF for measurable reforms; RAS for advice [36]"
    notes: ["3.4.3#5-7"]

