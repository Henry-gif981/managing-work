  # ================================================================= INTRODUCTION
  - tpl: chapter
    part: intro
    ground: night
    obj: center
    title: "Introduction"
    sub: "Why the IBRD matters for Vietnam after its shift from IDA lending"
    notes: []
  - tpl: hero
    part: intro
    ground: paper
    ref: "Introduction · 1.1"
    title: "The role of multilateral development finance"
    art: globe
    bullets:
      - "**Funding gap:** long-term investment needs far exceed what domestic resources can provide"
      - "**Costly markets:** international borrowing is costly, short-term, or not available at all"
      - "**MDB advantage:** cheap funds passed on as longer maturities and lower interest rates"
      - "**Crisis role:** MDBs expanded lending in the 2008 crisis and the COVID-19 pandemic"
      - "**Catalytic role:** co-financing, guarantees and risk sharing attract private investors"
      - "**Beyond finance:** appraisal, technical assistance, procurement and safeguard standards"
    notes: ["intro-1.1"]
  - tpl: timeline
    part: intro
    ground: wash
    ref: "Introduction · 1.2"
    title: "Vietnam's shift from IDA to IBRD"
    art: coins
    items:
      - {d: "2007", t: "The Bank declares Vietnam IBRD-eligible"}
      - {d: "December 2009", t: "First IBRD loan: US$500 million Public Investment Reform loan [1; 2]"}
      - {d: "July 2017", t: "Graduates from IDA; no more regular IDA credits"}
      - {d: "From 2018", t: "IBRD and non-concessional IDA terms; IDA18 transitional support (FY18–20) [3]"}
      - {d: "July 2026", t: "Reclassified as an upper-middle-income economy [4]"}
    notes: ["intro-1.2#1"]
  - tpl: hero
    part: intro
    ground: paper
    ref: "Introduction · 1.2"
    title: "Why the IBRD matters now"
    art: temple
    bullets:
      - "**Main source:** the IBRD is now Vietnam's main source of World Bank financing"
      - "**Middle path:** dearer than IDA credits, cheaper and longer-term than most commercial loans"
      - "**Growing needs:** official financing alone will not be enough; markets cost more [3]"
      - "**Careful choices:** higher borrowing costs mean projects must be chosen and managed carefully"
      - "**Beyond money:** project appraisal, technical advice and international standards"
    notes: ["intro-1.2#2-4"]
  - tpl: cards
    part: intro
    ground: paper
    ref: "Introduction · 2"
    title: "Research problem and four questions"
    lead: "IBRD loans come with different terms and procedures from the concessional credits Vietnam was used to."
    cols: 2
    art: seal
    cards:
      - {h: "Q1", b: "What is the IBRD, and how was it formed and developed?"}
      - {h: "Q2", b: "How is the IBRD organized and funded, and on what terms does it lend?"}
      - {h: "Q3", b: "How does the IBRD support project financing through financial, technical and training assistance?"}
      - {h: "Q4", b: "What results and limitations have selected IBRD-supported projects in Vietnam shown, and what lessons follow?"}
    notes: ["intro-2"]
  - tpl: compare
    part: intro
    ground: wash
    ref: "Introduction · 3"
    title: "Two research objectives"
    art: magnifier
    left:
      h: "3.1 · Mechanisms"
      items:
        - "**Funding:** member countries' contributions and bond issues on international markets"
        - "**Lending:** IPF, DPF, program-for-results and guarantees, and when each applies"
        - "**Project cycle:** responsibilities shared with the borrower; co-financiers and private investors"
    right:
      h: "3.2 · Practice in Vietnam"
      items:
        - "**Case:** Transmission Efficiency Project (2015-2021), described as fully financed by an IBRD loan"
        - "**Four criteria:** relevance, effectiveness, efficiency and sustainability"
        - "**Context only:** Binh Duong and southern waterway projects, results not yet available"
    notes: ["intro-3.1", "intro-3.2"]
  - tpl: hero
    part: intro
    ground: paper
    ref: "Introduction · 4"
    title: "Research methodology"
    art: magnifier
    bullets:
      - "**Qualitative approach:** literature review with case study analysis, mainly secondary data"
      - "**Sources:** World Bank websites and reports; Government of Vietnam and ministry documents"
      - "**Case study:** TEP planned targets compared with actual results on the four criteria"
      - "**Reducing bias:** World Bank data checked against IEG and Vietnamese government sources"
      - "**Limits:** no field surveys or interviews; some data from the World Bank's own reports"
    notes: ["intro-4"]
  - tpl: cards
    part: intro
    ground: paper
    ref: "Introduction · 5"
    title: "Research scope"
    cols: 4
    art: map
    cards:
