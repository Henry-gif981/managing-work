      - {h: "Content", b: "Formation, funding, instruments, project cycle; financial, technical and training support"}
      - {h: "Space", b: "Vietnam; international examples only to explain how the IBRD works"}
      - {h: "Time", b: "2014 to the present, with special attention to the years after 2017"}
    notes: ["intro-5"]

  # ================================================================= CHAPTER 1 · 1.1–1.2
  - tpl: chapter
    part: ch1a
    ground: night
    obj: center
    title: "Overview of the IBRD"
    sub: "Definition, history, organization, instruments and loan conditions"
    notes: []
  - tpl: hero
    part: ch1a
    ground: paper
    ref: "1.1.1"
    title: "Definition, mission and borrowers"
    art: temple
    bullets:
      - "**Cooperative:** a global development cooperative owned by 189 member countries [7]"
      - "**World Bank:** one of five Group institutions; with IDA forms the World Bank [7]"
      - "**Not profit-maximizing:** raises funds on capital markets, lends for development purposes"
      - "**Mission:** end extreme poverty and boost shared prosperity on a livable planet; jobs central"
      - "**Borrowers:** middle-income and creditworthy poorer countries, usually national governments"
      - "**Eligibility:** income level and creditworthiness; Vietnam moved from IDA to IBRD after 2017"
    notes: ["1.1.1"]
  - tpl: table
    part: ch1a
    ground: paper
    ref: "1.1.2"
    title: "The five institutions of the World Bank Group"
    table: T1
    highlight: rows
    notes: ["1.1.2#1", "T1"]
  - tpl: compare
    part: ch1a
    ground: wash
    ref: "1.1.2"
    title: "How the IBRD differs"
    art: map
    left:
      h: "IBRD"
      items:
        - "**Oldest and largest:** founded in 1944; the largest development bank in the world"
        - "**Pricing:** market-based interest rates"
        - "**Clients:** governments, or entities guaranteed by governments"
    right:
      h: "IDA · IFC · MIGA · ICSID"
      items:
        - "**IDA:** much cheaper terms, funded by donors, for the poorest countries"
        - "**IFC:** invests in private companies without a government guarantee"
        - "**MIGA and ICSID:** no direct finance; reduce investor risk, settle disputes"
    foot: "The IBRD is the main channel for public financing to middle-income countries, which is why it matters for Vietnam today."
    notes: ["1.1.2#2-3"]
  - tpl: timeline
    part: ch1a
    ground: paper
    ref: "1.2"
    title: "History in four stages"
    art: temple
    items:
      - {d: "1944–1950s", t: "Bretton Woods, July 1944; first loan US$250 million to France, 1947 [9]; Marshall Plan shifts focus [8]"}
      - {d: "1950s–1970s", t: "Power, roads, railways, irrigation; IFC 1956, IDA 1960; McNamara-era poverty focus [8]"}
      - {d: "1980s–1990s", t: "Structural adjustment after the debt crisis; then governance, anti-corruption, safeguards"}
      - {d: "2000–present", t: "Counter-cyclical lending in 2008 and COVID-19; 2013 twin goals; livable planet, jobs [8]"}
    foot: "After more than 80 years: from a reconstruction bank for Europe to a global development institution; the funding model stayed the same."
    notes: ["1.2"]

  # ================================================================= CHAPTER 1 · 1.3
  - tpl: gallery
    part: ch1b
    ground: night
    obj: left
    ref: "1.3.1"
    title: "Governance on three levels"
    bullets:
      - "**Board of Governors:** highest body; one Governor per member; meets once a year"
      - "**Kept powers:** admits members, changes capital, approves annual financial statements"
      - "**Board of Executive Directors:** the President and 25 Executive Directors; meets several times a week"
      - "**Approves:** loans, guarantees and the budget; formal votes weighted by shareholding"
      - "**President:** chairs the Board and leads the Group; five-year renewable term"
      - "**Today:** Ajay Banga, President since 2 June 2023 [10]"
    notes: ["1.3", "1.3.1"]
  - tpl: stats
    part: ch1b
    ground: paper
    ref: "1.3.2"
    title: "Voting power follows shares"
    art: scales
    nums:
      - {v: "15–16%", l: "United States share of votes"}
      - {v: "85%", l: "majority to amend the Articles of Agreement"}
      - {v: "0.21%", l: "Vietnam's votes, April 2026 [11]"}
    bullets:
      - "**Membership:** IMF membership first, then subscription to IBRD capital shares"
      - "**One share, one vote:** equal basic votes plus one vote per share held"
      - "**Effective veto:** the United States can block decisions needing an 85 percent majority"
      - "**Vietnam:** votes through a constituency sharing one Executive Director"
    notes: ["1.3.2"]
  - tpl: process
    part: ch1b
    ground: wash
    ref: "1.3.3"
    title: "Where the money comes from"
    art: vault
    steps:
      - {h: "Member capital", b: "Small paid-in share; callable capital never called; capital increase in 2018 [12]"}
      - {h: "Bond issuance", b: "Largest source; AAA rating for decades; sustainable and green bonds [13]"}
      - {h: "The IBRD", b: "Financial intermediary between global markets and member countries"}
      - {h: "Loans", b: "Long maturities, reasonable costs; repayments recycled into new loans"}
    bullets:
      - "**Versus IDA:** IDA depends on regular donations; the IBRD funds itself through the market"
      - "**New tools:** hybrid capital and guarantees from shareholders"
    notes: ["1.3.3"]

  # ================================================================= CHAPTER 1 · 1.4
  - tpl: gallery
    part: ch1c
    ground: night
    obj: carousel
    ref: "1.4 · 1.4.1"
    title: "Three lending instruments"
    lead: "A single loan product, the IBRD Flexible Loan, sets price and repayment terms."
    carousel: [IPF, DPF, PforR]
    bullets:
      - "**IPF:** ring-fenced works, equipment, consulting; disbursed as eligible expenditures are incurred [14]"
      - "**DPF:** policy reforms; prior actions before approval; funds to the general budget [14]"
      - "**PforR:** introduced 2012, third instrument since 1944 [15]; disbursed on verified DLIs [14]"
    notes: ["1.4#1", "1.4.1#1-3"]
  - tpl: quote
    part: ch1c
    ground: wash
    ref: "1.4.1"
    art: seal
    quote: "Under IPF, it pays for inputs; under DPF, for reforms; under PforR, for results."
    by: "Section 1.4.1 of the paper"
    bullets:
      - "**Case studies:** TEP and CCSEP were both financed through IPF"
      - "**First IBRD loan:** a DPF, US$500 million, approved December 2009, signed 30 December 2009 [2]"
    notes: ["1.4.1#4"]
  - tpl: table
    part: ch1c
    ground: paper
    ref: "1.4.1"
    title: "The three lending instruments compared"
    table: T2
    notes: ["T2"]
  - tpl: hero
    part: ch1c
    ground: paper
    ref: "1.4.2"
    title: "Loan terms: the price"
    art: ledger
    bullets:
      - "**IBRD Flexible Loan:** leading product for public-sector borrowers in middle-income countries [16]"
      - "**Three cost parts:** an interest rate, a front-end fee and a commitment fee [16]"
      - "**Interest:** reference rate plus spread; SOFR replaced LIBOR for US dollar loans [17]"
      - "**Spread:** lending spread plus maturity premium; fixed-spread option suspended in 2021 [17]"
      - "**Commitment fee:** charged on undisbursed balances, so slow disbursement raises the cost"
    notes: ["1.4.2#1-2", "1.4.2#5"]
  - tpl: stats
    part: ch1c
    ground: wash
    ref: "1.4.2"
    title: "Loan terms: long maturities"
    art: coins
    nums:
      - {v: "35 years", l: "maximum final maturity since 2014, up from 30 [18]"}
      - {v: "50 years", l: "final maturity for some projects [19]"}
      - {v: "7 years", l: "Short Maturity Loan, October 2024 [20]"}
    bullets:
      - "**Average maturity:** maximum raised from 18 to 20 years in 2014 [18]"
      - "**Short Maturity Loan:** 20-basis-point discount on the spread [20]"
      - "**TEP:** 26-year maturity with a 10-year grace period [21]"
      - "**CCSEP:** IBRD loan 29 years, 10-year grace; IDA credit 25 years, 5-year grace"
    notes: ["1.4.2#3-4"]
  - tpl: table
    part: ch1c
    ground: paper
    ref: "1.4.2"
    title: "Main terms of the IBRD Flexible Loan"
    table: T3
    notes: ["T3"]
  - tpl: hero
    part: ch1c
    ground: paper
    ref: "1.4.3"
    title: "Safeguards and procurement"
    art: stamp
    bullets:
      - "**ESF:** approved 4 August 2016; IPF projects initiated on or after 1 October 2018 [22]"
      - "**Older policies:** earlier projects keep Safeguard Policies such as OP 4.12; about seven years in parallel [23]"
      - "**TEP and CCSEP:** both prepared before 2018, so followed the Safeguard Policies"
      - "**Procurement Framework:** concept note on or after 1 July 2016 [24]; PPSD prepared by CCSEP"
      - "**Stricter rules:** gaps with domestic land rules cause delays or, in Nha Trang, lost financing"
    notes: ["1.4.3#1-2", "1.4.3#14-15"]
  - tpl: grid
    part: ch1c
    ground: wash
    ref: "1.4.3"
    title: "Ten Environmental and Social Standards"
    lead: "The ESF shifts more responsibility to the borrower, who must meet ten standards throughout the project [22]."
    items:
      - "ESS1: Assessment and Management of Environmental and Social Risks and Impacts"
      - "ESS2: Labor and Working Conditions"
      - "ESS3: Resource Efficiency and Pollution Prevention and Management"
      - "ESS4: Community Health and Safety"
      - "ESS5: Land Acquisition, Restrictions on Land Use and Involuntary Resettlement"
      - "ESS6: Biodiversity Conservation and Sustainable Management of Living Natural Resources"
      - "ESS7: Indigenous Peoples"
      - "ESS8: Cultural Heritage"
      - "ESS9: Financial Intermediaries"
      - "ESS10: Stakeholder Engagement and Information Disclosure"
    notes: ["1.4.3#3-13"]

  # ================================================================= CHAPTER 2
  - tpl: chapter
    part: ch2
    ground: night
    obj: center
    title: "How the IBRD supports project financing"
    sub: "Financial support, technical support, training and capacity building"
    notes: ["2.1"]
  - tpl: cycle
    part: ch2
    ground: night
    obj: ring
    ref: "2.1.1"
    title: "The six-stage project cycle"
    lead: "The borrower owns and implements the project; the Bank advises, appraises, finances and supervises [25]."
    steps:
      - {h: "Identification", b: "Project concept consistent with the Country Partnership Framework"}
      - {h: "Preparation", b: "Feasibility, design, E&S instruments, procurement plan"}
      - {h: "Appraisal", b: "Bank review; Project Appraisal Document (PAD)"}
      - {h: "Negotiation and Board approval", b: "Loan Agreement signed and declared effective"}
      - {h: "Implementation and supervision", b: "Bank supervises; ISRs; may restructure"}
      - {h: "Completion and evaluation", b: "ICR, then independent validation by IEG"}
    notes: ["2.1.1#1"]
  - tpl: table
    part: ch2
    ground: paper
    ref: "2.1.1"
    title: "Stages of the World Bank project cycle"
    table: T4
    highlight: rows
    notes: ["T4"]
  - tpl: hero
    part: ch2
    ground: paper
    ref: "2.1.1"
    title: "The cycle does not end at approval"
    art: gears
    bullets:
      - "**Restructuring:** TEP restructured in 2019 and extended by two years"
      - "**Cancellation:** CCSEP restructured in 2022; about US$45.6 million of loan funds cancelled"
      - "**Two systems:** proposal approval, investment decision, counterpart funds and on-lending run alongside"
      - "**Joint delays:** CCSEP became effective about five and a half months later than planned"
    notes: ["2.1.1#2-3"]
  - tpl: table
    part: ch2
    ground: paper
    ref: "2.1.2"
    title: "Four disbursement methods"
    table: T5
    lead: "Methods are set out in each project's disbursement letter [26; 27]."
    notes: ["2.1.2#1", "T5"]
  - tpl: hero
    part: ch2
    ground: wash
    ref: "2.1.2"
    title: "Counterpart funding as the binding constraint"
    art: ledger
    bullets:
      - "**Documentation:** statements of expenditure or interim financial reports; deadline usually four months after closing [26]"
      - "**Counterpart role:** in CCSEP it paid land, resettlement, staff salaries, operating costs, training"
      - "**TEP:** NPT provided US$231.25 million of the planned US$731.25 million [21]"
      - "**Idle money:** CCSEP provincial allocations began July 2019; no disbursement in 2017 and 2018"
      - "**Real debt:** where loans are on-lent, provinces take on real debt obligations"
    notes: ["2.1.2#2-4"]
  - tpl: compare
    part: ch2
    ground: paper
    ref: "2.1.3"
    title: "IPF and PforR in practice"
    art: gears
    left:
      h: "IPF · builds assets"
      items:
        - "**Structure:** components, a results framework and an implementing agency"
        - "**TEP model:** three components via NPT boards; IBRD paid against works and equipment"
        - "**Exposure:** land clearance or bidding delays slow the flow of funds directly"
    right:
      h: "PforR · rewards results"
      items:
        - "**DLIs:** funds released only after an agreed agency verifies each target"
        - "**Country systems:** relies on fiduciary and environmental systems assessed beforehand"
        - "**IEG:** the choice of DLIs is critical; monitor beyond DLIs alone [32]"
    foot: "For Vietnam, which has mainly used IPF, a results-based design shifts more responsibility, and more risk, onto domestic agencies."
    notes: ["2.1.3#1", "2.1.3#3-4"]
  - tpl: stats
    part: ch2
    ground: wash
    ref: "2.1.3"
    title: "DPF in Vietnam: from policy matrix to budget"
    art: stamp
    nums:
      - {v: "US$500 million", l: "PIR, first operation, December 2009 [2]"}
      - {v: "US$87.3 + 262.7 million", l: "IBRD + IDA, second PIR, May 2011 [28]"}
      - {v: "US$200 + 111.8 million", l: "IBRD + IDA, power-sector DPF, 2010 [31]"}
    bullets:
      - "**Mechanism:** prior actions, such as a decree, then the loan is released to the budget"
      - "**PIR series:** two single-tranche operations [2]"
      - "**Aims:** public investment cycle; legal basis for public-private partnerships [29; 30]"
    notes: ["2.1.3#2"]
  - tpl: hero
    part: ch2
    ground: paper
    ref: "2.2 · 2.2.1"
    title: "Technical support: preparation"
    art: magnifier
    bullets:
      - "**Task team:** technical, financial, procurement and safeguard specialists advise the borrower"
      - "**Viability check:** TEP's appraisal estimated an EIRR of 31.4%"
      - "**E&S instruments:** CCSEP prepared an ESIA per city and one resettlement framework [33]"
      - "**Preparation Advance:** finances costly preparation; later refinanced from the loan [27]"
      - "**Quality matters:** better smart-grid preparation would have avoided TEP's extension"
    notes: ["2.2#1", "2.2.1"]
  - tpl: stats
    part: ch2
    ground: wash
    ref: "2.2.2"
    title: "Advisory Services and Analytics"
    art: lecture
    nums:
      - {v: "US$991 million", l: "ASA disbursements in 2023 [35]"}
      - {v: "68%", l: "from donor trust funds [35]"}
      - {v: "26%", l: "from the Bank's administrative budget [35]"}
      - {v: "6%", l: "from Reimbursable Advisory Services [35]"}
    bullets:
      - "**ASA:** reports, policy notes, hands-on advice and workshops [34]"
      - "**RAS:** the client requests and pays [34]; mainly middle- and high-income countries [36]"
      - "**Vietnam:** PIR policy dialogue [2]; PPIAF US$350,000 and GIZ support for CCSEP"
    notes: ["2.2.2"]
  - tpl: process
    part: ch2
    ground: paper
    ref: "2.2.3"
    title: "Monitoring and evaluation on three levels"
    art: magnifier
    lead: "CCSEP's results framework: about 290,000 beneficiaries, 256,000 sewer connections, 100% cost recovery."
    steps:
      - {h: "Supervision", b: "Regular ISRs rate progress towards the PDO ({{ay:World Bank, n.d.-c|25|inferred}})"}
      - {h: "Completion", b: "The ICR at closing compares results with targets"}
      - {h: "Independent evaluation", b: "IEG validates the ICR; a PPAR for selected projects"}
    notes: ["2.2.3#1-5"]
  - tpl: hero
    part: ch2
    ground: paper
    ref: "2.2.3"
    title: "What M&E shows, and its limits"
    art: stamp
    bullets:
      - "**TEP PPAR:** outcome highly satisfactory, Bank performance satisfactory, M&E substantial [37]"
      - "**Early warning:** in 2022 CCSEP's PDO likelihood fell to moderately unsatisfactory"
      - "**Attribution:** system-wide indicators such as transmission losses are not the project alone"
      - "**No ICR:** for CCSEP, assessment must rely on interim reports"
    notes: ["2.2.3#6-7"]
  - tpl: hero
    part: ch2
    ground: wash
    ref: "2.3 · 2.3.1"
    title: "Training project management units"
    art: lecture
    bullets:
