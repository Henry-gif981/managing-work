# ---------------------------------------------------------------------------
# CHARTS — rebuilt as native PowerPoint charts ONLY from numbers printed in the
# paper's tables/text (or printed as data labels on the paper's own figure).
# "basis" says exactly where every number comes from.
# ---------------------------------------------------------------------------
charts:
  F1:
    caption: "Figure 1. TEP financing structure: committed/appraised resources versus actual closing expenditure (million USD)"
    type: bar_stacked
    categories: ["Appraisal financing", "Actual expenditure"]
    series:
      - {name: "IBRD financing", values: [500.00, 318.53]}
      - {name: "Borrower financing", values: [231.25, 199.00]}
    number_format: '0.00'
    basis: "Table 12 (Total row): appraisal 731.25 = IBRD 500.00 + borrower 231.25; actual 517.53 = IBRD 318.53 + borrower 199.00 (calculated: 517.53 − 318.53; the paper states “approximately USD 199.00 million”, Section 3.2.5)."
    source: "Source: Chart prepared by the authors using data from World Bank ({{ay:2022a, Annex 3, Table 3.2|41|inferred}}). Actual expenditure is not equivalent to contractual loan availability."
  F2:
    caption: "Figure 2. TEP expenditure by investment component at appraisal and at closing (million USD)"
    type: bar_clustered
    categories: ["Transmission infrastructure", "Smart-grid network", "Capacity building"]
    series:
      - {name: "Appraisal cost", values: [625.00, 80.00, 25.00]}
      - {name: "Actual cost", values: [464.53, 46.01, 5.74]}
    number_format: '0.00'
    basis: "Table 11 / Table 12 (component rows)."
    source: "Source: Chart prepared by the authors using data from World Bank ({{ay:2022a, Annex 3, Table 3.1|41|inferred}}). The USD 1.25 million front-end fee is excluded from the three component bars but included in total project costs."
  F3:
    caption: "Figure 3. TEP output achievement relative to original results targets (%)"
    type: bar_horizontal
    categories: ["New lines", "Rehabilitated lines", "Transformer capacity", "500-kV substations", "220-kV substations"]
    series:
      - {name: "Achievement of appraisal target (%)", values: [106.6, 217.5, 107.9, 100.0, 90.9]}
    number_format: '0.0"%"'
    basis: "Table 14, column “Achieved / target” (percentages calculated by the authors of the paper)."
    source: "Source: Chart calculated by the authors from World Bank ({{ay:2023, p. 8|37|inferred}}). A value of 100% means that the original output target was met, not that all project-wide economic benefits were realised."
  F4:
    caption: "Figure 4. Vietnam’s electricity transmission loss ratio, 2015-2022 (%)"
    type: line
    categories: ["2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022"]
    series:
      - {name: "Transmission loss ratio (%)", values: [2.34, 2.36, 2.45, 2.44, 2.15, 2.23, 2.29, 2.54]}
    number_format: '0.00'
    basis: "2015 (2.34), 2019 (2.15), 2021 (2.29) and 2022 (2.54) are stated in Table 15 and Section 3.2.4. 2016 (2.36), 2017 (2.45), 2018 (2.44) and 2020 (2.23) are the data labels printed on the paper’s own Figure 4."
    source: "Source: Chart prepared by the authors from World Bank ({{ay:2023, Table 2.3, p. 11|37|inferred}}), which cites EVN as the underlying data source. The system-wide transmission loss ratio is not a TEP-only impact estimate. The IEG executive summary reports 2.50% for 2022, whereas Table 2.3 reports 2.54%."
  F5:
    caption: "Figure 5. Project financing structure as planned at appraisal"
    type: doughnut
    categories: ["IBRD", "IDA", "Counterpart funding"]
    series:
      - {name: "Share of total project cost (%)", values: [16.8, 69.5, 13.7]}
    number_format: '0.0"%"'
    basis: "Section 3.3.2: IBRD USD 46 million (16.8%), IDA USD 190.2 million (69.5%), counterpart USD 37.4 million (13.7%)."
    source: "Source: projects.worldbank.org"
  F6:
    caption: "Figure 6. Share of on-granting and on-lending by financing source"
    type: bar_horizontal_stacked100
    categories: ["IBRD loan (all four cities)", "IDA credit – Dong Hoi", "IDA credit – Phan Rang", "IDA credit – Quy Nhon", "IDA credit – Nha Trang"]
    series:
      - {name: "On-granted (%)", values: [0, 80, 80, 70, 50]}
      - {name: "On-lent (%)", values: [100, 20, 20, 30, 50]}
    number_format: '0"%"'
    basis: "Section 3.3.2: entire IBRD loan on-lent; IDA on-granted 80% (Dong Hoi, Phan Rang), 70% (Quy Nhon), 50% (Nha Trang). On-lent shares = 100 − on-granted (calculated)."
    source: "Source: projects.worldbank.org"
  F7:
    caption: "Figure 7. Sources of funding by city (million USD)"
    type: bar_stacked
    categories: ["Dong Hoi", "Nha Trang", "Phan Rang–Thap Cham", "Quy Nhon"]
    series:
      - {name: "IDA on-granted", values: [28.7, 22.1, 52.1, 31.5]}
      - {name: "IDA on-lent", values: [7.2, 22.1, 13.0, 13.5]}
      - {name: "IBRD (100% on-lent)", values: [14.3, 16.4, 10.2, 5.1]}
      - {name: "Counterpart funding", values: [8.2, 11.4, 12.7, 5.2]}
    number_format: '0.0'
    basis: "Data labels printed on the paper’s own Figure 7. Cross-check with Section 3.3.2: city totals 58.4 / 72.0 / 87.9 / 55.3; IBRD Nha Trang 16.4, Dong Hoi 14.3. The printed Phan Rang labels sum to 88.0 (text: 87.9) — rounding, see ISSUES.md."
    source: "Source: projects.worldbank.org"
  F8:
    caption: "Figure 8. Total funding by city: plan vs. adjusted (million USD)"
    type: bar_clustered
    categories: ["Dong Hoi", "Quy Nhon", "Nha Trang", "Phan Rang–Thap Cham"]
    series:
      - {name: "Plan", values: [58.4, 55.3, 72.0, 87.9]}
      - {name: "Adjusted", values: [null, 33.2, null, 97.9]}
    number_format: '0.0'
    basis: "Section 3.3.2 text only: plan totals for all four cities; adjusted totals are stated only for Quy Nhon (33.2) and Phan Rang–Thap Cham (97.9). Dong Hoi and Nha Trang adjusted values appear only as unlabeled bars in the paper’s figure and are NOT estimated here; the original figure is shown beside the chart."
    source: "Source: projects.worldbank.org"
  F8img:
    caption: "Figure 8 (original image from the paper, unlabeled bars)"
    type: image
    files: ["fig8-plan.png", "fig8-adjusted.png"]
  DPF:
    caption: "DPF operations named in Section 2.1.3 (million USD)"
    type: bar_stacked
    categories: ["PIR 1 (Dec 2009)", "PIR 2 (May 2011)", "Power-sector DPF (2010)"]
    series:
      - {name: "IBRD", values: [500, 87.3, 200]}
      - {name: "IDA", values: [null, 262.7, 111.8]}
    number_format: '0.0'
    basis: "Section 2.1.3 text: PIR 1 US$500 million IBRD [2]; PIR 2 IBRD US$87.3 million + IDA US$262.7 million [28]; power-sector DPF US$200 million IBRD + US$111.8 million IDA [31]. Not a figure in the paper — a chart of figures stated in the text."
    source: "Data: Section 2.1.3 of the paper ([2], [28], [31])."
  ASA:
    caption: "Analytical and advisory disbursements, 2023 (US$991 million)"
    type: doughnut
    categories: ["Donor trust funds", "Bank administrative budget", "Reimbursable Advisory Services"]
    series:
      - {name: "Share (%)", values: [68, 26, 6]}
    number_format: '0"%"'
    basis: "Section 2.2.2 text [35]. Not a figure in the paper."
    source: "Data: Section 2.2.2 of the paper ([35])."
  TWH:
    caption: "Electricity transmitted by the NPT system (TWh)"
    type: bar_clustered
    categories: ["2018", "2021", "2022"]
    series:
      - {name: "Electricity transmitted (TWh)", values: [184.50, 200.86, 211.47]}
    number_format: '0.00'
    basis: "Section 3.2.4 text [37, pp. viii–ix, 8–9]. National-level context, not a TEP-only result."
    source: "Data: Section 3.2.4 of the paper ([37, pp. viii–ix, 8–9]). Not a measure of electricity supplied solely because of TEP."
  DISB:
    caption: "CCSEP disbursement: PAD projection vs. reported by late 2022 (million USD)"
    type: bar_stacked
    categories: ["PAD projection (end FY2022)", "Disbursed by late 2022"]
    series:
      - {name: "Total (PAD projection)", values: [212.3, null]}
      - {name: "IBRD", values: [null, 16.47]}
      - {name: "IDA", values: [null, 68.34]}
    number_format: '0.00'
    basis: "Section 3.3.3 text [43]: PAD projected USD 212.3 million by end FY2022; IBRD 16.47 + IDA 68.34 ≈ USD 84.8 million (36% of original loan capital)."
    source: "Data: Section 3.3.3 of the paper ([33; 55; 43])."
